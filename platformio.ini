; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Dua sketch dalam satu project, dipilih lewat environment:
;   - esp32dev : sketch PRODUKSI (Finalnew)  -> receiver lengkap (radio + MPU + ESC)
;   - movetest : sketch TES GERAK (MoveTest)  -> tanpa radio, buat ngetes motor + MPU
; Folder sketch dipilih otomatis oleh select_sketch.py (per environment).
; Flash produksi  : pio run -e esp32dev -t upload
; Flash tes gerak : pio run -e movetest -t upload
[platformio]
src_dir = Master Code/Robot/New/Finalnew
default_envs = esp32dev

; ===== Opsi bersama semua environment =====
[env]
platform = espressif32@^6.5.0
board = esp32dev
framework = arduino
board_build.flash_mode = dio
monitor_speed = 9600
; Kalau upload gagal dengan "Failed to communicate with the flash chip" atau
; "Packet content transfer stopped", TURUNKAN dulu ke 115200 untuk memastikan.
; Tapi kalau di 115200 pun tetap gagal DAN warning flash chip tetap muncul,
; penyebabnya bukan baud melainkan catu/ground — periksa wiring, jangan
; buang waktu menurunkan baud lebih jauh.
upload_speed = 921600
monitor_filters = esp32_exception_decoder, time
extra_scripts = pre:select_sketch.py
lib_deps =
	nrf24/RF24@^1.4.8
	tockn/MPU6050_tockn@^1.5.2
	madhephaestus/ESP32Servo@^1.1.1
build_flags =
	-D CORE_DEBUG_LEVEL=0

; ===== PRODUKSI: receiver lengkap (radio + MPU + ESC) — sketch Finalnew =====
[env:esp32dev]
; PCB robot tidak menarik GPIO0 ke LOW sendiri, jadi esptool gagal dengan
; "Wrong boot mode detected (0x13)". Sama persis dengan env mputest: masuk mode
; download SECARA MANUAL dulu (tahan BOOT, ketuk EN, lepas BOOT), lalu upload.
; Dengan no_reset esptool tidak me-reset chip sehingga mode itu bertahan.
; Hapus dua baris ini bila rangkaian auto-reset sudah dipasang di PCB.
;
; Tiap flag WAJIB di baris sendiri — ditulis sebagai satu string,
; esptool membacanya sebagai satu argumen dan menolak dengan "invalid choice".
upload_flags =
    --before
    no_reset

; ===== TES GERAK: tanpa radio, ngetes motor + MPU — sketch MoveTest =====
[env:movetest]

; ===== TES ESC MURNI: tanpa MPU/NRF, ramp throttle — sketch EscTest =====
; Flash: pio run -e esctest -t upload
[env:esctest]
; EscTest.ino memakai Serial.begin(115200); [env] dipatok 9600 untuk firmware
; robot, jadi baud monitor WAJIB ditimpa di sini — kalau tidak, yang tampil
; cuma karakter sampah dan angka PWM-nya tidak terbaca.
monitor_speed = 115200
; PCB robot tidak menarik GPIO0 ke LOW sendiri: masuk mode download manual
; (tahan BOOT, ketuk EN, lepas BOOT) sebelum upload.
upload_flags =
    --before
    no_reset

; ===== TES/KALIBRASI MPU-9250: cek bus I2C, offset gyro, magnetometer =====
; Sketch MPU Test/mpu. Selain gyro, sekarang juga membaca AK8963 (magnet) dan
; menampilkan heading MUTLAK — bandingkan dengan Yaw gyro untuk melihat drift.
; Flash: pio run -e mputest -t upload
[env:mputest]
; Sketch mpu.ino memakai Serial.begin(115200) — [env] di atas dipatok 9600
; untuk firmware robot, jadi baud monitor WAJIB ditimpa di sini. Tanpa ini
; serial monitor hanya menampilkan karakter sampah.
monitor_speed = 115200
; SEMENTARA — dipakai saat rangkaian auto-reset board tidak menarik GPIO0 ke
; LOW ("Wrong boot mode detected (0x13)"). Dengan no_reset, esptool TIDAK
; me-reset chip, sehingga mode download yang dimasuki manual (tahan BOOT +
; ketuk EN) tetap bertahan. Hapus dua baris ini bila auto-reset sudah normal.
;
; Catatan: tiap flag WAJIB di baris sendiri. Menaruhnya sebagai satu string
; ("--before no_reset") membuat esptool membacanya sebagai satu argumen dan
; gagal dengan "invalid choice".
upload_flags =
    --before
    no_reset

; ===== DIAGNOSA NRF24: dump register lewat SPI MENTAH, tanpa pustaka RF24 =====
; Dipakai saat Finalnew berhenti di "NRF FAIL". Pesan itu hanya bilang
; radio.begin() gagal tanpa menyebut sebabnya; sketch ini memisahkan
; "modul tidak ada" / "MISO putus" / "MOSI-SCK-CSN putus" / "chip rusak".
; Baud monitor ditimpa karena [env] dipatok 9600 untuk firmware robot.
; Flash: pio run -e nrfdiag -t upload  &&  pio device monitor
[env:nrfdiag]
monitor_speed = 115200
upload_flags =
    --before
    no_reset

; ===== DIAGNOSA I2C: scan bus + dump register MENTAH, tanpa pustaka MPU =====
; Dipakai saat sudut MPU beku/ngawur & kita perlu tahu penyebab pastinya.
; Flash: pio run -e mpudiag -t upload  &&  pio device monitor
[env:mpudiag]

; ===== SKETCH MPU YANG SAMA, TAPI DI ARDUINO NANO =====
; Berguna untuk menguji modul MPU secara terpisah dari ESP32/robot: kalau di
; Nano modulnya hidup, berarti modul MPU-nya sehat dan masalahnya ada di
; wiring/board robot.
;
; I2C Nano TERPAKU di A4 (SDA) & A5 (SCL) — tidak bisa dipindah ke pin lain.
;
; DAYA — BEDA dengan modul lama: GY-521 (MPU-6050) punya regulator sendiri jadi
; boleh 5V, tetapi modul MPU-9250 polos 3.3V MURNI dan RUSAK bila diberi 5V.
; Sambungkan VCC ke pin 3V3 Nano, GND ke GND. Pin I2C Nano bekerja di level 5V,
; jadi untuk pemakaian singkat di meja masih terbaca; untuk pemasangan tetap
; pakai ESP32 (3.3V) atau level shifter.
;
; PIN BARU yang tidak ada di MPU-6050 (modul polos 10 pin) — WAJIB disambung,
; kalau tidak modul terlihat seperti "tidak ada" walau sehat:
;   ADO   -> GND   mengunci alamat di 0x68 (mengambang bisa jadi 0x69)
;   NCS   -> 3V3   mengunci mode I2C; bila LOW saat menyala, chip masuk mode
;                  SPI dan I2C-nya mati total di SEMUA alamat
;   FSYNC -> GND   jangan mengambang
;   EDA/ECL/INT    dibiarkan kosong
;
; Seluruh setelan ESP32 di [env] harus ditimpa di sini: platform, board,
; pustaka (RF24/ESP32Servo tidak ada di AVR), baud upload, dan monitor_filters
; (esp32_exception_decoder tidak berlaku).
;
; Flash: pio run -e nanotest -t upload  &&  pio device monitor
[env:nanotest]
platform = atmelavr
board = nanoatmega328         ; bootloader LAMA (57600). Kalau suatu saat pakai
                              ; Nano bootloader baru, ganti ke
                              ; "nanoatmega328new" + upload_speed 115200.
                              ;
                              ; CATATAN: "not in sync" yang sempat terjadi BUKAN
                              ; soal baud — penyebabnya modul MPU yang menarik
                              ; rel daya sampai Nano tidak sanggup menjalankan
                              ; bootloader. Cabut modul dulu bila terulang.
framework = arduino
lib_deps = tockn/MPU6050_tockn@^1.5.2   ; peta register accel/gyro 9250 = 6050,
                                        ; magnet AK8963 dibaca langsung di sketch
upload_speed = 57600
monitor_speed = 115200        ; ikut Serial.begin() di mpu.ino, bukan 9600 [env]
monitor_filters = time
build_flags =
