; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; src_dir = sketch produksi (receiver lengkap: radio + MPU + ESC).
; Untuk flash sketch TES GERAK (tanpa radio), override src_dir lewat env var:
;   PowerShell:  $env:PLATFORMIO_SRC_DIR="Master Code/New/MoveTest"; pio run -t upload
[platformio]
src_dir = Master Code/New/Finalnew

[env:esp32dev]
platform = espressif32@^6.5.0
board = esp32dev
framework = arduino
board_build.flash_mode = dio
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder, time
lib_deps =
	nrf24/RF24@^1.4.8
	tockn/MPU6050_tockn@^1.5.2
	madhephaestus/ESP32Servo@^1.1.1
build_flags =
	-D CORE_DEBUG_LEVEL=0
