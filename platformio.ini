; ============================================================
;  PlatformIO Project Configuration
;  Robot Akuatik Feeder Otomatis - ESP32 Receiver
; ============================================================
;  Cara pakai (di VS Code, setelah install extension "PlatformIO IDE"):
;    - Build  : Ctrl+Alt+B  (atau ikon ✓ di status bar bawah)
;    - Upload : Ctrl+Alt+U  (atau ikon →)
;    - Serial Monitor : ikon colok (🔌) di status bar
;  Sketch yang dikompilasi diambil dari folder 'src_dir' di bawah.
; ============================================================

[platformio]
; Hanya kompilasi sketch receiver (Finalnew.ino). Sketch lain di repo diabaikan.
src_dir = Master Code/New/Finalnew

[env:esp32dev]
platform = espressif32@^6.5.0
board = esp32dev
framework = arduino

; Serial
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder, time

; Library (otomatis di-download saat build pertama)
lib_deps =
    nrf24/RF24@^1.4.8
    tockn/MPU6050_tockn@^1.5.2
    madhephaestus/ESP32Servo@^1.1.1

build_flags =
    -D CORE_DEBUG_LEVEL=0
