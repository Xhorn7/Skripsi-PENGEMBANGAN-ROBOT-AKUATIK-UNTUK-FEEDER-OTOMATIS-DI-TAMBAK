<!DOCTYPE html>

<html lang="id">

<title>Schematic New - Robot Akuatik Feeder</title>
<style>

</style>
</head>
<body>
<svg width="1123" height="794" viewBox="0 0 1123 794" xmlns="http://www.w3.org/2000/svg">

  <!-- ===== Frame ===== -->
  <rect x="6" y="6" width="1111" height="782" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <rect x="16" y="16" width="1091" height="762" fill="none" stroke="#aaa" stroke-width="1"/>
  <!-- column numbers -->
  <g font-size="10" fill="#888" text-anchor="middle">

  <!-- ===== CATATAN ===== -->
  <rect class="blk" x="26" y="34" width="268" height="158" rx="3"/>
  <text class="noteh" x="36" y="52">CATATAN</text>
  <text class="note" x="36" y="70">&#8226; Net berlabel sama = terhubung (mis. +3V3, VBAT+).</text>
  <text class="note" x="36" y="85">&#8226; Semua simbol ground = common ground (0 V).</text>
  <text class="note" x="36" y="100">&#8226; NRF24 &amp; MPU6050 disuplai 3V3 dari ESP32.</text>
  <text class="note" x="36" y="115">&#8226; ESC &amp; motor disuplai LiPo (VBAT, Deans/T).</text>
  <text class="note" x="36" y="130">&#8226; ESP32 disuplai +5V dari buck converter.</text>
  <text class="note" x="36" y="145">&#8226; ESC: SIG&#8596;IO25/26, GND&#8596;GND.</text>
  <text class="warn" x="36" y="160">&#9888; +5V servo-lead ESC JANGAN ke ESP32.</text>
  <text class="warn" x="36" y="178">&#9888; NRF CE/CSN di GPIO4/5 (hindari GPIO6&#8211;11=flash).</text>

  <!-- ===== LEGENDA ===== -->

  <line class="w-bat" x1="38" y1="312" x2="74" y2="312"/><text class="note" x="82" y="316">VBAT (baterai)</text>
  <line class="w-gnd" x1="38" y1="330" x2="74" y2="330"/><text class="note" x="82" y="334">Ground (GND)</text>

  <g transform="translate(180,326)"><line class="w-gnd" x1="0" y1="-6" x2="0" y2="0"/><line class="w-gnd" x1="-7" y1="0" x2="7" y2="0"/><line class="w-gnd" x1="-4" y1="3" x2="4" y2="3"/><line class="w-gnd" x1="-2" y1="6" x2="2" y2="6"/></g>

  <line class="w-bat" x1="208" y1="500" x2="236" y2="500"/>
  <text class="batlbl" x="171" y="528">VBAT&#8211;</text>
  <line class="w-gnd" x1="208" y1="522" x2="226" y2="522"/>

  <text class="blkt" x="36" y="580">Buck Converter</text>

    <line x1="510" y1="190" x2="520" y2="190"/>
